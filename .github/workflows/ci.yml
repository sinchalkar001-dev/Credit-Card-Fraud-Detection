name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Train the model
        run: python train_model.py
      - name: Run the tests
        run: python -m unittest discover -s tests -t . -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t credit-risk-fraud-detection .
      - name: Start a container
        run: docker run -d --name app -p 5000:5000 credit-risk-fraud-detection
      - name: Wait for the health check
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:5000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
      - name: Score the sample file through the API
        run: curl -fsS -X POST http://localhost:5000/api/predict-batch -F "file=@data/sample_upload.csv" | head -c 400
